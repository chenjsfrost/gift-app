# Publishes the landing page and demo video to GitHub Pages. The app itself runs on
# your PC. Rebuilt daily so the Christmas countdown and the season stay current.
name: Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '5 16 * * *' # 00:05 in Singapore
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build:site
        env:
          TZ: Asia/Singapore
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
